name: ActiRune Achievement Format Apply

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-achievement-format-apply.yml'
      - 'lib/features/profile/achievement_contract.dart'
      - 'test/achievement_contract_test.dart'

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply canonical Dart format
        run: >-
          dart format
          lib/features/profile/achievement_contract.dart
          test/achievement_contract_test.dart

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            lib/features/profile/achievement_contract.dart
            test/achievement_contract_test.dart
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Apply canonical achievement formatting'
          git push origin HEAD:integration/artwork-interactions-20260921
