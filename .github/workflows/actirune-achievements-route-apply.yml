name: ActiRune Achievements Route Apply

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-achievements-route-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921
      - name: Connect Profile Achievements route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/app/main_shell.dart')
          text = path.read_text()
          import_anchor = "import '../features/profile/player_level_screen.dart';\n"
          import_replacement = "import '../features/profile/achievements_screen.dart';\n" + import_anchor
          if "achievements_screen.dart" not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('Achievements import anchor not found exactly once')
              text = text.replace(import_anchor, import_replacement)

          method_anchor = "  Future<void> _openProfileHistory(BuildContext context) async {\n"
          method = """  Future<void> _openAchievements(BuildContext context) async {\n    await Navigator.of(context).push<void>(\n      MaterialPageRoute<void>(\n        builder: (routeContext) => AchievementsScreen(\n          onBack: () => Navigator.of(routeContext).pop(),\n          onNotifications: () => _openNotifications(routeContext),\n          onShowInProfile: () => Navigator.of(routeContext).pop(),\n          onRootNavigate: (next) =>\n              _closeChildStackAndSelect(routeContext, next.name),\n          battleRootEnabled: _battleAvailable,\n        ),\n      ),\n    );\n  }\n\n"""
          if "_openAchievements(BuildContext context)" not in text:
              if text.count(method_anchor) != 1:
                  raise SystemExit('Achievements method anchor not found exactly once')
              text = text.replace(method_anchor, method + method_anchor)

          profile_anchor = "        onProfileDetails: () => _openPlayerLevel(context),\n        onWorldProgress: () => _openWorldProgression(context),\n"
          profile_replacement = "        onProfileDetails: () => _openPlayerLevel(context),\n        onBadges: () => _openAchievements(context),\n        onWorldProgress: () => _openWorldProgression(context),\n"
          if "onBadges: () => _openAchievements(context)," not in text:
              if text.count(profile_anchor) != 1:
                  raise SystemExit('Achievements Profile anchor not found exactly once')
              text = text.replace(profile_anchor, profile_replacement)

          path.write_text(text)
          PY
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format Achievements route and tests
        run: dart format lib/app/main_shell.dart test/achievements_screen_test.dart
      - name: Commit Achievements route
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/main_shell.dart test/achievements_screen_test.dart
          if git diff --cached --quiet; then
            echo 'No Achievements formatting or route changes to commit.'
            exit 0
          fi
          git commit -m 'Apply canonical Achievements route formatting'
          git push origin HEAD:integration/artwork-interactions-20260921
