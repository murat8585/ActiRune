name: ActiRune Analytics Contract Stage

on:
  push:
    branches:
      - integration/analytics-contract-stage-20260923
    paths:
      - '.github/workflows/actirune-analytics-contract-stage.yml'

permissions:
  contents: write

jobs:
  validate-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout analytics contract stage
        uses: actions/checkout@v4
        with:
          ref: integration/analytics-contract-stage-20260923

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply canonical Dart format
        run: >-
          dart format
          lib/core/analytics/analytics_event.dart
          test/analytics_event_contract_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused analytics contract tests
        run: >-
          flutter test --no-pub
          test/analytics_event_contract_test.dart
          test/loot_crafting_policy_test.dart
          test/rewarded_ad_policy_test.dart
          test/verified_movement_router_test.dart

      - name: Full Flutter tests
        run: flutter test --no-pub

      - name: Diff hygiene
        run: git diff --check

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/core/analytics/analytics_event.dart test/analytics_event_contract_test.dart; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/analytics/analytics_event.dart test/analytics_event_contract_test.dart
          git commit -m 'Apply canonical analytics contract formatting'
          git push origin HEAD:integration/analytics-contract-stage-20260923
