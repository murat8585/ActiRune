name: ActiRune Calibration Engine Stage

on:
  push:
    branches:
      - integration/calibration-engine-stage-20260923
    paths:
      - '.github/workflows/actirune-calibration-engine-stage.yml'
      - 'lib/features/onboarding/first_calibration_engine.dart'
      - 'lib/features/onboarding/onboarding_screen.dart'
      - 'test/first_calibration_engine_test.dart'
      - 'test/onboarding_exact_flow_test.dart'

permissions:
  contents: write

jobs:
  validate-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout calibration engine stage
        uses: actions/checkout@v4
        with:
          ref: integration/calibration-engine-stage-20260923

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply canonical Dart format
        run: >-
          dart format
          lib/features/onboarding/first_calibration_engine.dart
          lib/features/onboarding/onboarding_screen.dart
          test/first_calibration_engine_test.dart
          test/onboarding_exact_flow_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused calibration tests
        run: >-
          flutter test --no-pub
          test/first_calibration_engine_test.dart
          test/onboarding_exact_flow_test.dart

      - name: Full Flutter tests
        run: flutter test --no-pub

      - name: Diff hygiene
        run: git diff --check

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            lib/features/onboarding/first_calibration_engine.dart
            lib/features/onboarding/onboarding_screen.dart
            test/first_calibration_engine_test.dart
            test/onboarding_exact_flow_test.dart
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Apply canonical First Calibration formatting'
          git push origin HEAD:integration/calibration-engine-stage-20260923
