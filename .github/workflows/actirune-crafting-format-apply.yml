name: ActiRune Crafting Format Apply

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-crafting-format-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply canonical Dart format to Crafting files
        run: dart format lib/features/hero/crafting_screen.dart test/crafting_screen_test.dart
      - name: Commit canonical Crafting formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/features/hero/crafting_screen.dart test/crafting_screen_test.dart; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/hero/crafting_screen.dart test/crafting_screen_test.dart
          git commit -m 'Apply canonical Crafting formatting'
          git push origin HEAD:integration/artwork-interactions-20260921
