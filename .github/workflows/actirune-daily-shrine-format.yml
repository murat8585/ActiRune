name: ActiRune Daily Shrine Format Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-daily-shrine-format.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Daily and Shrine files
        run: >-
          dart format
          lib/features/quests/daily_quests_screen.dart
          test/daily_quests_route_integration_test.dart
          test/rune_shrine_ready_screen_test.dart

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: actirune-daily-shrine-formatted
          path: |
            lib/features/quests/daily_quests_screen.dart
            test/daily_quests_route_integration_test.dart
            test/rune_shrine_ready_screen_test.dart
          retention-days: 1
