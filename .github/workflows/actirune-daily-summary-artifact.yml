name: ActiRune Daily Summary Artwork Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-daily-summary-artifact.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Guard exact Daily Summary artwork
        shell: bash
        run: |
          set -euo pipefail
          test -f visual_authority/20260921/final_remaining_13/03_DAILY_SUMMARY_POPUP_FINAL.png

      - name: Upload exact Daily Summary artwork
        uses: actions/upload-artifact@v4
        with:
          name: actirune-daily-summary-reference
          path: visual_authority/20260921/final_remaining_13/03_DAILY_SUMMARY_POPUP_FINAL.png
          retention-days: 1
