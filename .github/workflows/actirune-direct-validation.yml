name: ActiRune Direct Validation

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/actirune-direct-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actirune-direct-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Guard canonical artwork presence
        shell: bash
        run: |
          set -euo pipefail
          test -f visual_authority/20260921/current/02_CORE_LOCKED_ANCHORS/VIS_0354__CORE_HOME_ANCHOR.png
          test -f visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0171__P1_HERO_MAIN_FINAL.png
          test -f visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0222__P1_PROFILE_FINAL.png
          test -f visual_authority/20260921/current/02_CORE_LOCKED_ANCHORS/VIS_0231__CORE_ADVENTURE_ANCHOR.png
          test -f visual_authority/20260921/final_remaining_13/01_EVENTS_FINAL.png
          test -f visual_authority/20260921/final_remaining_13/02_EVENT_DETAIL_POPUP_FINAL.png
          test -f visual_authority/20260921/final_p1/02_P1_EQUIPMENT_FINAL.png
          test -f visual_authority/20260921/final_p1/03_P1_INVENTORY_FINAL.png
          test -f visual_authority/20260921/final_p1/05_P1_MOVEMENT_MASTERY_FINAL.png
          test -f visual_authority/20260921/final_p1/06_P1_PLAYER_LEVEL_FINAL.png
          test -f visual_authority/20260921/final_p1/07_P1_SETTINGS_HUB_FINAL.png
          test -f visual_authority/20260921/final_remaining_13/08_SETTINGS_ACCOUNT_FINAL.png
          test -f visual_authority/20260921/final_remaining_13/09_SETTINGS_NOTIFICATIONS_FINAL.png
          test -f visual_authority/20260921/final_remaining_13/10_SETTINGS_PRIVACY_FINAL.png
          test -f visual_authority/20260921/final_remaining_13/11_SETTINGS_PERMISSIONS_FINAL.png
          test -f visual_authority/20260921/final_remaining_13/12_SETTINGS_ACCESSIBILITY_FINAL.png
          test -f visual_authority/20260921/final_remaining_13/13_PROFILE_HISTORY_FINAL.png
          test -f visual_authority/20260921/final_p0_battle/P0_BATTLE_PREP_FINAL.png
          test -f visual_authority/20260921/final_p0_battle/P0_CAMERA_PREP_FINAL.png
          test -f visual_authority/20260921/current/02_CORE_LOCKED_ANCHORS/VIS_0168__CORE_LIVE_BATTLE_ANCHOR.png
          test -f visual_authority/20260921/current/02_CORE_LOCKED_ANCHORS/VIS_0353__CORE_FORM_COACH_OVERLAY_ANCHOR.png
          test -f visual_authority/20260921/final_p0_battle/P0_VICTORY_FINAL.png
          test -f visual_authority/20260921/final_p0_battle/P0_DEFEAT_FINAL_CANDIDATE.png

      - name: Inspect canonical artwork dimensions
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          paths = [
              'visual_authority/20260921/current/02_CORE_LOCKED_ANCHORS/VIS_0354__CORE_HOME_ANCHOR.png',
              'visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0171__P1_HERO_MAIN_FINAL.png',
              'visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0222__P1_PROFILE_FINAL.png',
              'visual_authority/20260921/current/02_CORE_LOCKED_ANCHORS/VIS_0231__CORE_ADVENTURE_ANCHOR.png',
              'visual_authority/20260921/final_remaining_13/01_EVENTS_FINAL.png',
              'visual_authority/20260921/final_remaining_13/02_EVENT_DETAIL_POPUP_FINAL.png',
              'visual_authority/20260921/final_p1/02_P1_EQUIPMENT_FINAL.png',
              'visual_authority/20260921/final_p1/03_P1_INVENTORY_FINAL.png',
              'visual_authority/20260921/final_p1/05_P1_MOVEMENT_MASTERY_FINAL.png',
              'visual_authority/20260921/final_p1/06_P1_PLAYER_LEVEL_FINAL.png',
              'visual_authority/20260921/final_p1/07_P1_SETTINGS_HUB_FINAL.png',
              'visual_authority/20260921/final_remaining_13/08_SETTINGS_ACCOUNT_FINAL.png',
              'visual_authority/20260921/final_remaining_13/09_SETTINGS_NOTIFICATIONS_FINAL.png',
              'visual_authority/20260921/final_remaining_13/10_SETTINGS_PRIVACY_FINAL.png',
              'visual_authority/20260921/final_remaining_13/11_SETTINGS_PERMISSIONS_FINAL.png',
              'visual_authority/20260921/final_remaining_13/12_SETTINGS_ACCESSIBILITY_FINAL.png',
              'visual_authority/20260921/final_remaining_13/13_PROFILE_HISTORY_FINAL.png',
              'visual_authority/20260921/final_p0_battle/P0_BATTLE_PREP_FINAL.png',
              'visual_authority/20260921/final_p0_battle/P0_CAMERA_PREP_FINAL.png',
              'visual_authority/20260921/current/02_CORE_LOCKED_ANCHORS/VIS_0168__CORE_LIVE_BATTLE_ANCHOR.png',
              'visual_authority/20260921/current/02_CORE_LOCKED_ANCHORS/VIS_0353__CORE_FORM_COACH_OVERLAY_ANCHOR.png',
              'visual_authority/20260921/final_p0_battle/P0_VICTORY_FINAL.png',
              'visual_authority/20260921/final_p0_battle/P0_DEFEAT_FINAL_CANDIDATE.png',
          ]
          for path in paths:
              with open(path, 'rb') as handle:
                  header = handle.read(24)
              if header[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Not PNG: {path}')
              width, height = struct.unpack('>II', header[16:24])
              if (width, height) != (941, 1672):
                  raise SystemExit(f'Unexpected artwork size: {path} {width}x{height}')
              print(f'ARTWORK_DIMENSION {path} {width}x{height}')
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Focused interaction tests
        run: >-
          flutter test --no-pub
          test/main_shell_navigation_test.dart
          test/child_route_integration_test.dart
          test/events_route_integration_test.dart
          test/event_detail_popup_test.dart
          test/home_interaction_test.dart
          test/adventure_interaction_test.dart
          test/hero_interaction_test.dart
          test/profile_interaction_test.dart
          test/combat_engine_test.dart
          test/battle_session_engine_test.dart
          test/battle_prep_interaction_test.dart
          test/camera_prep_interaction_test.dart
          test/artwork_interaction_test.dart
          test/form_coach_interaction_test.dart
          test/victory_interaction_test.dart
          test/defeat_interaction_test.dart
          test/battle_flow_host_test.dart
          test/battle_screen_adapter_test.dart

      - name: Full Flutter tests
        run: flutter test --no-pub

      - name: Diff hygiene
        run: git diff --check
