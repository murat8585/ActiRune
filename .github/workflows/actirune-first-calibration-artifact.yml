name: ActiRune First Calibration Artwork Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-first-calibration-artifact.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Guard exact First Calibration artwork
        shell: bash
        run: |
          set -euo pipefail
          test -f visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0180__P1_FIRST_CALIBRATION_FINAL.png

      - name: Upload exact First Calibration artwork
        uses: actions/upload-artifact@v4
        with:
          name: actirune-first-calibration-reference
          path: visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0180__P1_FIRST_CALIBRATION_FINAL.png
          retention-days: 1
