name: ActiRune Flexible Activity Stage

on:
  push:
    branches:
      - integration/flexible-activity-stage-20260923
    paths:
      - '.github/workflows/actirune-flexible-activity-stage.yml'
      - 'lib/features/quests/flexible_activity_path_policy.dart'
      - 'test/flexible_activity_path_policy_test.dart'

permissions:
  contents: write

jobs:
  validate-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout flexible activity stage
        uses: actions/checkout@v4
        with:
          ref: integration/flexible-activity-stage-20260923

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply canonical Dart format
        run: >-
          dart format
          lib/features/quests/flexible_activity_path_policy.dart
          test/flexible_activity_path_policy_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused flexible activity tests
        run: >-
          flutter test --no-pub
          test/flexible_activity_path_policy_test.dart
          test/recovery_safety_engine_test.dart
          test/quest_engine_test.dart

      - name: Full Flutter tests
        run: flutter test --no-pub

      - name: Diff hygiene
        run: git diff --check

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            lib/features/quests/flexible_activity_path_policy.dart
            test/flexible_activity_path_policy_test.dart
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Apply canonical flexible activity formatting'
          git push origin HEAD:integration/flexible-activity-stage-20260923
