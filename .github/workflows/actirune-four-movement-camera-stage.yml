name: ActiRune Four Movement Camera Stage

on:
  push:
    branches:
      - integration/four-movement-camera-stage-20260923
    paths:
      - '.github/workflows/actirune-four-movement-camera-stage.yml'
      - 'lib/features/pose/detector/pose_rep_detector.dart'
      - 'lib/features/pose/detector/movement_detector_factory.dart'
      - 'lib/features/pose/detector/squat_detector.dart'
      - 'lib/features/pose/detector/lunge_detector.dart'
      - 'lib/features/pose/detector/push_up_detector.dart'
      - 'lib/features/pose/detector/plank_detector.dart'
      - 'lib/features/pose/provider/pose_camera_controller.dart'
      - 'lib/features/battle/battle_pose_detector_factory.dart'
      - 'lib/features/battle/battle_session_engine.dart'
      - 'lib/features/battle/battle_screen.dart'
      - 'lib/features/battle/battle_flow_host.dart'
      - 'lib/features/battle/live_battle_screen.dart'
      - 'lib/features/battle/verified_movement_router.dart'
      - 'test/pose_camera_controller_dispatch_test.dart'
      - 'test/battle_pose_detector_factory_test.dart'
      - 'test/battle_session_engine_test.dart'
      - 'test/verified_movement_router_test.dart'

permissions:
  contents: write

jobs:
  validate-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout four-movement camera stage
        uses: actions/checkout@v4
        with:
          ref: integration/four-movement-camera-stage-20260923

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply canonical Dart format
        run: >-
          dart format
          lib/features/pose/detector/pose_rep_detector.dart
          lib/features/pose/detector/movement_detector_factory.dart
          lib/features/pose/detector/squat_detector.dart
          lib/features/pose/detector/lunge_detector.dart
          lib/features/pose/detector/push_up_detector.dart
          lib/features/pose/detector/plank_detector.dart
          lib/features/pose/provider/pose_camera_controller.dart
          lib/features/battle/battle_pose_detector_factory.dart
          lib/features/battle/battle_session_engine.dart
          lib/features/battle/battle_screen.dart
          lib/features/battle/battle_flow_host.dart
          lib/features/battle/live_battle_screen.dart
          lib/features/battle/verified_movement_router.dart
          test/pose_camera_controller_dispatch_test.dart
          test/battle_pose_detector_factory_test.dart
          test/battle_session_engine_test.dart
          test/verified_movement_router_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused camera and battle movement tests
        run: >-
          flutter test --no-pub
          test/pose_camera_controller_dispatch_test.dart
          test/battle_pose_detector_factory_test.dart
          test/squat_detector_test.dart
          test/lunge_detector_test.dart
          test/push_up_detector_test.dart
          test/plank_detector_test.dart
          test/mlkit_pose_provider_test.dart
          test/battle_session_engine_test.dart
          test/verified_movement_router_test.dart
          test/battle_flow_host_test.dart
          test/battle_screen_adapter_test.dart

      - name: Full Flutter tests
        run: flutter test --no-pub

      - name: Diff hygiene
        run: git diff --check

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            lib/features/pose/detector/pose_rep_detector.dart
            lib/features/pose/detector/movement_detector_factory.dart
            lib/features/pose/detector/squat_detector.dart
            lib/features/pose/detector/lunge_detector.dart
            lib/features/pose/detector/push_up_detector.dart
            lib/features/pose/detector/plank_detector.dart
            lib/features/pose/provider/pose_camera_controller.dart
            lib/features/battle/battle_pose_detector_factory.dart
            lib/features/battle/battle_session_engine.dart
            lib/features/battle/battle_screen.dart
            lib/features/battle/battle_flow_host.dart
            lib/features/battle/live_battle_screen.dart
            lib/features/battle/verified_movement_router.dart
            test/pose_camera_controller_dispatch_test.dart
            test/battle_pose_detector_factory_test.dart
            test/battle_session_engine_test.dart
            test/verified_movement_router_test.dart
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Apply canonical four-movement camera formatting'
          git push origin HEAD:integration/four-movement-camera-stage-20260923
