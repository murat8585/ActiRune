name: ActiRune Ana Dunya Final Validation

on:
  push:
    branches:
      - fix/full-ui-interaction-wiring-20260925
    paths:
      - '.github/workflows/actirune-home-final-validation.yml'
      - 'lib/app/main_shell.dart'
      - 'lib/core/**'
      - 'lib/features/home/**'
      - 'lib/features/adventure/world_progression_screen.dart'
      - 'lib/features/profile/settings_*.dart'
      - 'lib/features/quests/**'
      - 'test/home_*.dart'
      - 'test/daily_quests_*.dart'
      - 'test/weekly_quests_*.dart'
      - 'test/events_*.dart'
      - 'test/event_detail_popup_test.dart'
      - 'test/world_progression_*.dart'
      - 'test/daily_summary_popup_test.dart'
      - 'test/rune_shrine_*.dart'
      - 'test/quest_engine_test.dart'
      - 'test/progression_policy_test.dart'
      - 'test/rewarded_ad_policy_test.dart'
      - 'test/monetization_provider_contracts_test.dart'
      - 'test/provider_authority_lock_test.dart'
      - 'test/production_interaction_wiring_test.dart'
      - 'tool/interaction_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-home:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Python production interaction audit
        run: python3 tool/interaction_audit.py

      - name: Strict Dart format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Ana Dunya isolated interaction and engine tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            test/home_interaction_test.dart
            test/home_hitbox_regression_test.dart
            test/home_settings_route_test.dart
            test/home_subtree_production_test.dart
            test/home_permissions_production_test.dart
            test/home_subtree_navigation_test.dart
            test/home_subtree_auxiliary_navigation_test.dart
            test/daily_quests_route_integration_test.dart
            test/daily_quests_screen_test.dart
            test/weekly_quests_screen_test.dart
            test/events_route_integration_test.dart
            test/event_detail_popup_test.dart
            test/world_progression_route_integration_test.dart
            test/world_progression_screen_test.dart
            test/daily_summary_popup_test.dart
            test/rune_shrine_ready_screen_test.dart
            test/rune_shrine_result_test.dart
            test/quest_engine_test.dart
            test/progression_policy_test.dart
            test/rewarded_ad_policy_test.dart
            test/monetization_provider_contracts_test.dart
            test/provider_authority_lock_test.dart
          )
          for test_file in "${tests[@]}"; do
            echo "=== $test_file ==="
            flutter test --no-pub "$test_file"
          done

      - name: Production interaction wiring regression
        run: flutter test --no-pub test/production_interaction_wiring_test.dart

      - name: Full Flutter regression suite
        run: flutter test --no-pub

      - name: Diff hygiene
        run: git diff --check
