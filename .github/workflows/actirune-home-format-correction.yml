name: ActiRune Home Format Correction

on:
  push:
    branches:
      - fix/full-ui-interaction-wiring-20260925
    paths:
      - '.github/workflows/actirune-home-format-correction.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-ui-interaction-wiring-20260925
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format Dart sources
        run: dart format lib test

      - name: Commit formatter output only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo 'Formatter changed:'
          git --no-pager diff --name-only -- lib test
          git rm .github/workflows/actirune-home-format-correction.yml
          git add lib test
          git diff --cached --check
          git commit -m "Format Home interaction changes"
          git push origin HEAD:fix/full-ui-interaction-wiring-20260925
