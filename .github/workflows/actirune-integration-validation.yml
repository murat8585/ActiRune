name: ActiRune Integration Validation

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '_handoff/READY_20260922'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actirune-integration-validation
  cancel-in-progress: false

jobs:
  validate-and-promote:
    if: github.ref == 'refs/heads/integration/artwork-interactions-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921
          fetch-depth: 0

      - name: Verify visual authority remains present
        shell: bash
        run: |
          set -euo pipefail
          test -d visual_authority/20260921/final_p0_battle
          test -d visual_authority/20260921/final_p1
          test -d visual_authority/20260921/final_remaining_13
          test -d visual_authority/20260921/social_approved

      - name: Restore source bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(_handoff/ACTIRUNE_INTEGRATION_SOURCE_BUNDLE_20260922.tar.gz.b64.part-*)
          test ${#parts[@]} -gt 0
          cat "${parts[@]}" > /tmp/actirune-source.b64
          base64 --decode /tmp/actirune-source.b64 > /tmp/actirune-source.tar.gz
          echo 'Actual staged source bundle SHA-256:'
          sha256sum /tmp/actirune-source.tar.gz
          echo '52892f29ba5ad170423f45c66d541ad5f565956a139f99b01b6c25937346958a  /tmp/actirune-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/actirune-source.tar.gz -C .
          if git status --short visual_authority | grep -q .; then
            echo 'visual_authority unexpectedly changed by source bundle' >&2
            git status --short visual_authority
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format source
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Battle and artwork contract tests
        run: >-
          flutter test --no-pub
          test/battle_session_engine_test.dart
          test/final_battle_artwork_test.dart
          test/artwork_interaction_test.dart
          test/final_artwork_interaction_contract_test.dart
          test/final_route_binding_test.dart

      - name: Full Flutter tests
        run: flutter test --no-pub

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Guard protected paths
        shell: bash
        run: |
          set -euo pipefail
          if git status --short visual_authority | grep -q .; then
            echo 'visual_authority changed during validation' >&2
            git status --short visual_authority
            exit 1
          fi
          git diff --check

      - name: Promote validated source to integration branch
        shell: bash
        env:
          BRANCH: integration/artwork-interactions-20260921
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Integration'
          git config user.email 'openai-integration@users.noreply.github.com'
          git add \
            lib test scripts android \
            pubspec.yaml pubspec.lock analysis_options.yaml \
            ACTIRUNE_PRODUCT_AUTHORITY.md AGENTS.md
          if git diff --cached --quiet; then
            echo 'No source changes to promote.'
            exit 0
          fi
          if git diff --cached --name-only | grep '^visual_authority/'; then
            echo 'Refusing to commit visual_authority changes.' >&2
            exit 1
          fi
          git commit -m 'Integrate current ActiRune source and artwork interactions'
          git push origin "HEAD:${BRANCH}"
