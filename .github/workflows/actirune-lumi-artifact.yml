name: ActiRune Lumi Artwork Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-lumi-artifact.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921
      - name: Guard exact Lumi artwork
        run: test -f visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0178__P1_LUMI_FINAL.png
      - name: Upload exact Lumi artwork
        uses: actions/upload-artifact@v4
        with:
          name: actirune-lumi-reference
          path: visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0178__P1_LUMI_FINAL.png
          retention-days: 1
