name: ActiRune Lumi Stage Apply

on:
  push:
    branches:
      - integration/lumi-stage-20260923
    paths:
      - '.github/workflows/actirune-lumi-stage-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Lumi stage
        uses: actions/checkout@v4
        with:
          ref: integration/lumi-stage-20260923

      - name: Apply evidence-backed Lumi route and validation wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/app/main_shell.dart',
              "import '../features/hero/inventory_screen.dart';\nimport '../features/hero/movement_mastery_screen.dart';",
              "import '../features/hero/inventory_screen.dart';\nimport '../features/hero/lumi_screen.dart';\nimport '../features/hero/movement_mastery_screen.dart';",
          )

          replace_once(
              'lib/app/main_shell.dart',
              '  Future<void> _openMovementMastery(BuildContext context) async {',
              """  Future<void> _openLumi(BuildContext context) async {
            await Navigator.of(context).push<void>(
              MaterialPageRoute<void>(
                builder: (routeContext) => LumiScreen(
                  onRootNavigate: (next) =>
                      _closeChildStackAndSelect(routeContext, next.name),
                  battleRootEnabled: _battleAvailable,
                ),
              ),
            );
          }

          Future<void> _openMovementMastery(BuildContext context) async {""",
          )

          replace_once(
              'lib/app/main_shell.dart',
              """      HeroScreen(
                onEquipment: () => _openEquipment(context),
                onCharacterStory: () => _openQuestChain(context),""",
              """      HeroScreen(
                onEquipment: () => _openEquipment(context),
                onCompanion: () => _openLumi(context),
                onCompanionDetails: () => _openLumi(context),
                onCharacterStory: () => _openQuestChain(context),""",
          )

          replace_once(
              'test/child_route_integration_test.dart',
              "import 'package:actirune/features/hero/inventory_screen.dart';\nimport 'package:actirune/features/hero/movement_mastery_screen.dart';",
              "import 'package:actirune/features/hero/inventory_screen.dart';\nimport 'package:actirune/features/hero/lumi_screen.dart';\nimport 'package:actirune/features/hero/movement_mastery_screen.dart';",
          )

          replace_once(
              'test/child_route_integration_test.dart',
              """  testWidgets('Profile opens Player Level and History children', (
            tester,
          ) async {""",
              """  testWidgets('Hero companion entries open Lumi exact-art child', (
            tester,
          ) async {
            await tester.pumpWidget(const MaterialApp(home: MainShell()));
            await tester.pumpAndSettle();
            await openHero(tester);

            await tester.tap(
              find.byKey(const ValueKey('artwork-hotspot-hero.companion')),
            );
            await tester.pumpAndSettle();
            expect(find.byType(LumiScreen), findsOneWidget);

            await tester.tap(
              find.byKey(const ValueKey('artwork-hotspot-lumi.nav-hero')),
            );
            await tester.pumpAndSettle();

            await tester.tap(
              find.byKey(const ValueKey('artwork-hotspot-hero.companion-details')),
            );
            await tester.pumpAndSettle();
            expect(find.byType(LumiScreen), findsOneWidget);
          });

          testWidgets('Profile opens Player Level and History children', (
            tester,
          ) async {""",
          )

          replace_once(
              'pubspec.yaml',
              '    - visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0171__P1_HERO_MAIN_FINAL.png\n',
              '    - visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0171__P1_HERO_MAIN_FINAL.png\n    - visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0178__P1_LUMI_FINAL.png\n',
          )

          replace_once(
              '.github/workflows/actirune-direct-validation.yml',
              '          test -f visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0171__P1_HERO_MAIN_FINAL.png\n',
              '          test -f visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0171__P1_HERO_MAIN_FINAL.png\n          test -f visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0178__P1_LUMI_FINAL.png\n',
          )

          replace_once(
              '.github/workflows/actirune-direct-validation.yml',
              "              'visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0171__P1_HERO_MAIN_FINAL.png': (941, 1672),\n",
              "              'visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0171__P1_HERO_MAIN_FINAL.png': (941, 1672),\n              'visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0178__P1_LUMI_FINAL.png': (941, 1672),\n",
          )

          replace_once(
              '.github/workflows/actirune-direct-validation.yml',
              '          test/crafting_screen_test.dart\n',
              '          test/crafting_screen_test.dart\n          test/lumi_screen_test.dart\n',
          )
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply canonical Dart formatting
        run: >-
          dart format
          lib/features/hero/lumi_screen.dart
          lib/app/main_shell.dart
          test/lumi_screen_test.dart
          test/child_route_integration_test.dart

      - name: Analyze staged Lumi work
        run: flutter analyze

      - name: Test staged Lumi work
        run: >-
          flutter test --no-pub
          test/lumi_screen_test.dart
          test/child_route_integration_test.dart

      - name: Diff hygiene
        run: git diff --check

      - name: Commit staged Lumi work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/main_shell.dart lib/features/hero/lumi_screen.dart test/lumi_screen_test.dart test/child_route_integration_test.dart pubspec.yaml .github/workflows/actirune-direct-validation.yml
          git commit -m 'Wire canonical Lumi screen'
          git push origin HEAD:integration/lumi-stage-20260923
