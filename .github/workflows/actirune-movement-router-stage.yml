name: ActiRune Movement Router Stage

on:
  push:
    branches:
      - integration/movement-router-stage-20260923
    paths:
      - '.github/workflows/actirune-movement-router-stage.yml'

permissions:
  contents: write

jobs:
  validate-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout movement router stage
        uses: actions/checkout@v4
        with:
          ref: integration/movement-router-stage-20260923

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply canonical Dart format
        run: dart format lib/features/battle/verified_movement_router.dart test/verified_movement_router_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused movement routing tests
        run: >-
          flutter test --no-pub
          test/verified_movement_router_test.dart
          test/battle_session_engine_test.dart
          test/combat_engine_test.dart
          test/squat_detector_test.dart
          test/lunge_detector_test.dart
          test/push_up_detector_test.dart
          test/plank_detector_test.dart

      - name: Full Flutter tests
        run: flutter test --no-pub

      - name: Diff hygiene
        run: git diff --check

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/features/battle/verified_movement_router.dart test/verified_movement_router_test.dart; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/battle/verified_movement_router.dart test/verified_movement_router_test.dart
          git commit -m 'Apply canonical movement router formatting'
          git push origin HEAD:integration/movement-router-stage-20260923
