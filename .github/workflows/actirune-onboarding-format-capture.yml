name: ActiRune Onboarding Format Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-onboarding-format-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format onboarding source
        run: dart format lib/features/onboarding/onboarding_screen.dart

      - name: Upload formatted onboarding source
        uses: actions/upload-artifact@v4
        with:
          name: actirune-formatted-onboarding-source
          path: lib/features/onboarding/onboarding_screen.dart
          retention-days: 1
