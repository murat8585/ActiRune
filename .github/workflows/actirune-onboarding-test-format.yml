name: ActiRune Onboarding Test Format Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-onboarding-test-format.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format onboarding regression
        run: dart format test/onboarding_exact_flow_test.dart

      - name: Upload formatted onboarding regression
        uses: actions/upload-artifact@v4
        with:
          name: actirune-formatted-onboarding-test
          path: test/onboarding_exact_flow_test.dart
          retention-days: 1
