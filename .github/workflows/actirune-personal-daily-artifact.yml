name: ActiRune Personal Daily Artwork Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-personal-daily-artifact.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921
      - name: Guard exact Personal Daily Adventure artwork
        run: test -f visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0226__P1_PERSONAL_DAILY_ADVENTURE_FINAL.png
      - name: Upload exact Personal Daily Adventure artwork
        uses: actions/upload-artifact@v4
        with:
          name: actirune-personal-daily-reference
          path: visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0226__P1_PERSONAL_DAILY_ADVENTURE_FINAL.png
          retention-days: 1
