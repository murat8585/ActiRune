name: ActiRune Physical Evidence Stage

on:
  push:
    branches:
      - integration/physical-evidence-stage-20260923
    paths:
      - '.github/workflows/actirune-physical-evidence-stage.yml'

permissions:
  contents: write

jobs:
  validate-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout physical evidence stage
        uses: actions/checkout@v4
        with:
          ref: integration/physical-evidence-stage-20260923

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply canonical Dart format
        run: >-
          dart format
          lib/features/pose/validation/physical_validation_evidence.dart
          tool/validate_physical_mlkit_evidence.dart
          test/physical_validation_evidence_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused physical evidence tests
        run: >-
          flutter test --no-pub
          test/physical_validation_evidence_test.dart
          test/squat_detector_test.dart
          test/lunge_detector_test.dart
          test/push_up_detector_test.dart
          test/plank_detector_test.dart
          test/verified_movement_router_test.dart

      - name: Full Flutter tests
        run: flutter test --no-pub

      - name: Diff hygiene
        run: git diff --check

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/features/pose/validation/physical_validation_evidence.dart tool/validate_physical_mlkit_evidence.dart test/physical_validation_evidence_test.dart; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/pose/validation/physical_validation_evidence.dart tool/validate_physical_mlkit_evidence.dart test/physical_validation_evidence_test.dart
          git commit -m 'Apply canonical physical evidence formatting'
          git push origin HEAD:integration/physical-evidence-stage-20260923
