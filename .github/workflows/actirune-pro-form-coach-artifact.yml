name: ActiRune Pro Form Coach Artwork Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-pro-form-coach-artifact.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921
      - name: Guard exact Pro Form Coach artwork
        run: test -f visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0219__P1_PRO_FORM_COACH_FINAL.png
      - name: Upload exact Pro Form Coach artwork
        uses: actions/upload-artifact@v4
        with:
          name: actirune-pro-form-coach-reference
          path: visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0219__P1_PRO_FORM_COACH_FINAL.png
          retention-days: 1
