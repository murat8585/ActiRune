name: ActiRune Production Closeout Validation

on:
  push:
    branches:
      - production/closeout-20260924
    paths:
      - 'lib/core/release/**'
      - 'test/production_*'
      - 'test/provider_*'
      - 'test/store_*'
      - 'tool/check_production_release_readiness.dart'
      - 'tool/check_production_signing_preflight.dart'
      - 'tool/plan_production_identity_migration.dart'
      - 'tool/validate_provider_authority_lock.dart'
      - 'tool/validate_provider_configuration_evidence.dart'
      - 'tool/validate_store_submission_evidence.dart'
      - 'validation/release/provider_*'
      - 'validation/release/store_*'
      - 'android/app/**'
      - 'ios/Runner.xcodeproj/**'
      - '.gitignore'
      - 'PRODUCTION_CLOSEOUT.md'
      - 'docs/release/**'
      - '.github/workflows/actirune-production-readiness.yml'
      - '.github/workflows/actirune-production-closeout-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actirune-production-closeout-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact production-closeout HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify production-readiness exact-SHA checkout contract
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/actirune-production-readiness.yml'
          grep -F 'Checkout exact selected release-candidate SHA' "$workflow"
          grep -F 'ref:' "$workflow"
          grep -F 'github.sha' "$workflow"
          if grep -Fq 'integration/artwork-interactions-20260921' "$workflow"; then
            echo 'Production readiness must not hard-code the integration branch.' >&2
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify production-closeout formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/core/release/production_identity_candidate.dart
          lib/core/release/production_identity_guard.dart
          lib/core/release/production_release_guard.dart
          lib/core/release/production_signing_hygiene_guard.dart
          lib/core/release/provider_authority_lock.dart
          lib/core/release/provider_configuration_evidence.dart
          lib/core/release/store_submission_evidence.dart
          test/production_identity_candidate_test.dart
          test/production_identity_guard_test.dart
          test/production_release_guard_test.dart
          test/production_signing_hygiene_guard_test.dart
          test/provider_authority_lock_test.dart
          test/provider_configuration_evidence_test.dart
          test/store_submission_evidence_test.dart
          tool/check_production_release_readiness.dart
          tool/check_production_signing_preflight.dart
          tool/plan_production_identity_migration.dart
          tool/validate_provider_authority_lock.dart
          tool/validate_provider_configuration_evidence.dart
          tool/validate_store_submission_evidence.dart

      - name: Analyze
        run: flutter analyze

      - name: Production identity release signing provider and store regressions
        run: >-
          flutter test --no-pub
          test/production_identity_candidate_test.dart
          test/production_identity_guard_test.dart
          test/production_release_guard_test.dart
          test/production_signing_hygiene_guard_test.dart
          test/provider_authority_lock_test.dart
          test/provider_configuration_evidence_test.dart
          test/store_submission_evidence_test.dart

      - name: Exercise production signing preflight
        shell: bash
        run: |
          set +e
          output="$(dart run tool/check_production_signing_preflight.dart 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"
          test "$status" -eq 1
          grep -F 'androidDebugSigning' <<<"$output"
          grep -F 'missingIosDevelopmentTeam' <<<"$output"
          grep -F 'RESULT: BLOCKED' <<<"$output"
          if grep -Fq 'trackedSigningMaterial' <<<"$output"; then
            echo 'Tracked signing material detected.' >&2
            exit 1
          fi
          if grep -Fq 'missingRequiredIgnorePattern' <<<"$output"; then
            echo 'Signing ignore coverage regressed.' >&2
            exit 1
          fi

      - name: Exercise provider authority and configuration preflight
        shell: bash
        run: |
          set -euo pipefail

          set +e
          authority_missing="$(dart run tool/validate_provider_authority_lock.dart 2>&1)"
          authority_status=$?
          set -e
          printf '%s\n' "$authority_missing"
          test "$authority_status" -eq 1
          grep -F 'RESULT: BLOCKED_PROVIDER_AUTHORITY_MISSING' <<<"$authority_missing"

          set +e
          config_missing="$(dart run tool/validate_provider_configuration_evidence.dart 2>&1)"
          config_missing_status=$?
          set -e
          printf '%s\n' "$config_missing"
          test "$config_missing_status" -eq 1
          grep -F 'RESULT: BLOCKED_PROVIDER_AUTHORITY_MISSING' <<<"$config_missing"

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          cat > "$temp_dir/authority.json" <<'JSON'
          {
            "schemaVersion": 1,
            "androidApplicationId": "com.actirune.synthetic",
            "iosBundleIdentifier": "com.actirune.synthetic",
            "backendProvider": "Synthetic Backend",
            "billingProvider": "Synthetic Billing",
            "rewardedAdsProvider": "Synthetic Ads",
            "analyticsProvider": "Synthetic Analytics"
          }
          JSON

          cat > "$temp_dir/configuration.json" <<'JSON'
          {
            "schemaVersion": 1,
            "androidApplicationId": "com.actirune.synthetic",
            "iosBundleIdentifier": "com.actirune.synthetic",
            "releaseBuild": "synthetic-ci-fixture",
            "backend": {
              "providerName": "Synthetic Backend",
              "publicReference": "synthetic-backend-public-reference",
              "configured": true,
              "verificationMethods": ["automatedApiReadback"]
            },
            "billing": {
              "providerName": "Synthetic Billing",
              "publicReference": "synthetic-billing-public-reference",
              "configured": true,
              "verificationMethods": ["automatedApiReadback"]
            },
            "rewardedAds": {
              "providerName": "Synthetic Ads",
              "publicReference": "synthetic-ads-public-reference",
              "configured": true,
              "verificationMethods": ["automatedApiReadback"]
            },
            "analytics": {
              "providerName": "Synthetic Analytics",
              "publicReference": "synthetic-analytics-public-reference",
              "configured": true,
              "verificationMethods": ["automatedApiReadback"]
            }
          }
          JSON

          config_valid="$(dart run tool/validate_provider_configuration_evidence.dart \
            "$temp_dir/authority.json" "$temp_dir/configuration.json")"
          printf '%s\n' "$config_valid"
          grep -F 'RESULT: PROVIDER_CONFIGURATION_VALID' <<<"$config_valid"
          grep -F 'Public references: NOT_PRINTED' <<<"$config_valid"
          grep -F 'Credentials/secrets: NOT_SUPPORTED' <<<"$config_valid"

      - name: Exercise store submission evidence preflight
        shell: bash
        run: |
          set -euo pipefail

          set +e
          real_output="$(dart run tool/validate_store_submission_evidence.dart 2>&1)"
          real_status=$?
          set -e
          printf '%s\n' "$real_output"
          test "$real_status" -eq 1
          grep -F 'RESULT: BLOCKED_PROVIDER_AUTHORITY_MISSING' <<<"$real_output"

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          cat > "$temp_dir/authority.json" <<'JSON'
          {
            "schemaVersion": 1,
            "androidApplicationId": "com.actirune.synthetic",
            "iosBundleIdentifier": "com.actirune.synthetic",
            "backendProvider": "Synthetic Backend",
            "billingProvider": "Synthetic Billing",
            "rewardedAdsProvider": "Synthetic Ads",
            "analyticsProvider": "Synthetic Analytics"
          }
          JSON

          cat > "$temp_dir/store-ready.json" <<'JSON'
          {
            "schemaVersion": 1,
            "releaseGitCommit": "1234567890abcdef1234567890abcdef12345678",
            "releaseBuild": "synthetic-ci-fixture",
            "androidApplicationId": "com.actirune.synthetic",
            "iosBundleIdentifier": "com.actirune.synthetic",
            "apple": {
              "appStoreConnectAppReference": "apple-app-reference",
              "selectedBuildReference": "apple-build-reference",
              "requiredMetadataComplete": true,
              "appPrivacyComplete": true,
              "exportCompliance": "notRequired",
              "reviewAccessComplete": true,
              "monetizationItemsReady": true,
              "reviewState": "notSubmitted",
              "submissionReference": null
            },
            "googlePlay": {
              "playConsoleAppReference": "play-app-reference",
              "artifactReference": "play-artifact-reference",
              "playAppSigningVerified": true,
              "storeListingComplete": true,
              "appContentComplete": true,
              "dataSafetyComplete": true,
              "reviewAccessComplete": true,
              "productionAccess": "notRequired",
              "monetizationItemsReady": true,
              "reviewState": "notSubmitted",
              "submissionReference": null
            }
          }
          JSON

          set +e
          ready_output="$(dart run tool/validate_store_submission_evidence.dart \
            "$temp_dir/authority.json" "$temp_dir/store-ready.json" 2>&1)"
          ready_status=$?
          set -e
          printf '%s\n' "$ready_output"
          test "$ready_status" -eq 1
          grep -F 'RESULT: READY_FOR_STORE_SUBMISSION' <<<"$ready_output"

          python3 - "$temp_dir/store-ready.json" "$temp_dir/store-submitted.json" <<'PY'
          import json
          import sys

          source, destination = sys.argv[1:]
          data = json.load(open(source, encoding='utf-8'))
          data['apple']['reviewState'] = 'submitted'
          data['apple']['submissionReference'] = 'apple-submission-reference'
          data['googlePlay']['reviewState'] = 'submitted'
          data['googlePlay']['submissionReference'] = 'play-submission-reference'
          with open(destination, 'w', encoding='utf-8') as handle:
              json.dump(data, handle)
          PY

          submitted_output="$(dart run tool/validate_store_submission_evidence.dart \
            "$temp_dir/authority.json" "$temp_dir/store-submitted.json")"
          printf '%s\n' "$submitted_output"
          grep -F 'RESULT: STORE_SUBMISSION_EVIDENCE_VALID' <<<"$submitted_output"
          grep -F 'Store references: NOT_PRINTED' <<<"$submitted_output"
          grep -F 'Credentials/secrets: NOT_SUPPORTED' <<<"$submitted_output"

      - name: Exercise dry-run production identity migration planner
        shell: bash
        run: |
          set -euo pipefail

          valid_output="$(dart run tool/plan_production_identity_migration.dart \
            --android-id=com.actirune.app \
            --ios-bundle-id=com.actirune.app)"
          printf '%s\n' "$valid_output"
          grep -F 'Mode: DRY_RUN_ONLY' <<<"$valid_output"
          grep -F 'RESULT: READY_FOR_AUTHORITY_APPLY' <<<"$valid_output"

          set +e
          blocked_output="$(dart run tool/plan_production_identity_migration.dart \
            --android-id=com.example.actirune \
            --ios-bundle-id=com.example.actirune 2>&1)"
          blocked_status=$?
          set -e
          printf '%s\n' "$blocked_output"
          test "$blocked_status" -eq 2
          grep -F 'placeholderAndroidApplicationId' <<<"$blocked_output"
          grep -F 'placeholderIosBundleIdentifier' <<<"$blocked_output"
          grep -F 'RESULT: BLOCKED_CANDIDATE' <<<"$blocked_output"

      - name: Exercise unified production identity and release gate
        shell: bash
        run: |
          set +e
          output="$(dart run tool/check_production_release_readiness.dart 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            grep -F 'RESULT: PASS' <<<"$output"
          elif [ "$status" -eq 1 ]; then
            grep -F 'RESULT: BLOCKED' <<<"$output"
          else
            echo "Unexpected production guard exit code: $status" >&2
            exit "$status"
          fi

          if grep -Fq 'applicationId = "com.example.actirune"' android/app/build.gradle.kts; then
            test "$status" -eq 1
            grep -F 'release.placeholderAndroidApplicationId' <<<"$output"
            grep -F 'identity.placeholderAndroidNamespace' <<<"$output"
          fi
