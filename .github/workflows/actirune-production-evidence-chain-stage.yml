name: ActiRune Production Evidence Chain Stage

on:
  push:
    branches:
      - integration/production-evidence-chain-stage-20260923
    paths:
      - '.github/workflows/actirune-production-evidence-chain-stage.yml'

permissions:
  contents: write

jobs:
  validate-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout production evidence chain stage
        uses: actions/checkout@v4
        with:
          ref: integration/production-evidence-chain-stage-20260923

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply canonical Dart format
        run: >-
          dart format
          lib/core/release/provider_configuration_evidence.dart
          lib/features/pose/validation/physical_validation_final_review.dart
          tool/check_phase1_production_readiness.dart
          test/provider_configuration_evidence_test.dart
          test/physical_validation_final_review_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused production evidence tests
        run: >-
          flutter test --no-pub
          test/production_release_guard_test.dart
          test/provider_authority_lock_test.dart
          test/provider_configuration_evidence_test.dart
          test/physical_validation_evidence_test.dart
          test/physical_validation_final_review_test.dart
          test/phase1_release_readiness_test.dart

      - name: Verify current repository fails closed
        shell: bash
        run: |
          set +e
          dart run tool/check_phase1_production_readiness.dart | tee /tmp/actirune-readiness.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected current repository readiness to exit 1, got $status"
            exit 1
          fi
          grep -q 'RESULT: BLOCKED_PHASE1_PRODUCTION_READINESS' /tmp/actirune-readiness.log
          grep -q 'productionIdentityOrSigning' /tmp/actirune-readiness.log
          grep -q 'providerAuthorityUndecided' /tmp/actirune-readiness.log
          grep -q 'physicalEvidenceMissing' /tmp/actirune-readiness.log

      - name: Full Flutter tests
        run: flutter test --no-pub

      - name: Diff hygiene
        run: git diff --check

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            lib/core/release/provider_configuration_evidence.dart
            lib/features/pose/validation/physical_validation_final_review.dart
            tool/check_phase1_production_readiness.dart
            test/provider_configuration_evidence_test.dart
            test/physical_validation_final_review_test.dart
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Apply canonical production evidence chain formatting'
          git push origin HEAD:integration/production-evidence-chain-stage-20260923
