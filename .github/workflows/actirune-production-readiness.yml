name: ActiRune Production Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact selected release-candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify release-gate formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/core/release/production_release_guard.dart
          lib/core/release/provider_authority_lock.dart
          lib/core/release/provider_configuration_evidence.dart
          lib/core/release/phase1_release_readiness.dart
          lib/features/pose/validation/physical_validation_evidence.dart
          lib/features/pose/validation/physical_validation_final_review.dart
          tool/check_production_release_readiness.dart
          tool/validate_provider_authority_lock.dart
          tool/validate_physical_mlkit_evidence.dart
          tool/check_phase1_production_readiness.dart
          test/production_release_guard_test.dart
          test/provider_authority_lock_test.dart
          test/provider_configuration_evidence_test.dart
          test/physical_validation_evidence_test.dart
          test/physical_validation_final_review_test.dart
          test/phase1_release_readiness_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Release-gate regression tests
        run: >-
          flutter test --no-pub
          test/production_release_guard_test.dart
          test/provider_authority_lock_test.dart
          test/provider_configuration_evidence_test.dart
          test/physical_validation_evidence_test.dart
          test/physical_validation_final_review_test.dart
          test/phase1_release_readiness_test.dart

      - name: Enforce unified Phase-1 production readiness
        run: dart run tool/check_phase1_production_readiness.dart
