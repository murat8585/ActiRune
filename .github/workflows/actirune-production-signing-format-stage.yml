name: ActiRune Production Signing Formatter

on:
  push:
    branches:
      - production/closeout-20260924
    paths:
      - '.github/workflows/actirune-production-signing-format-stage.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout production closeout branch
        uses: actions/checkout@v4
        with:
          ref: production/closeout-20260924

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies before formatting
        run: flutter pub get

      - name: Apply canonical signing formatting
        run: dart format test/production_signing_hygiene_guard_test.dart

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- test/production_signing_hygiene_guard_test.dart; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/production_signing_hygiene_guard_test.dart
          git commit -m 'Apply canonical signing test formatting'
          git push origin HEAD:production/closeout-20260924
