name: ActiRune Provider Authority Stage

on:
  push:
    branches:
      - integration/provider-authority-stage-20260923
    paths:
      - '.github/workflows/actirune-provider-authority-stage.yml'

permissions:
  contents: write

jobs:
  validate-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout provider authority stage
        uses: actions/checkout@v4
        with:
          ref: integration/provider-authority-stage-20260923

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply canonical Dart format
        run: >-
          dart format
          lib/core/release/provider_authority_lock.dart
          tool/validate_provider_authority_lock.dart
          test/provider_authority_lock_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused provider authority tests
        run: >-
          flutter test --no-pub
          test/provider_authority_lock_test.dart
          test/production_release_guard_test.dart
          test/phase1_release_readiness_test.dart

      - name: Full Flutter tests
        run: flutter test --no-pub

      - name: Diff hygiene
        run: git diff --check

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/core/release/provider_authority_lock.dart tool/validate_provider_authority_lock.dart test/provider_authority_lock_test.dart; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/release/provider_authority_lock.dart tool/validate_provider_authority_lock.dart test/provider_authority_lock_test.dart
          git commit -m 'Apply canonical provider authority formatting'
          git push origin HEAD:integration/provider-authority-stage-20260923
