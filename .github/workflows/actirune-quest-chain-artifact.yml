name: ActiRune Quest Chain Artwork Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-quest-chain-artifact.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Guard exact Quest Chain artwork
        shell: bash
        run: |
          set -euo pipefail
          test -f visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0174__P1_QUEST_CHAIN_FINAL.png

      - name: Upload exact Quest Chain artwork
        uses: actions/upload-artifact@v4
        with:
          name: actirune-quest-chain-reference
          path: visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0174__P1_QUEST_CHAIN_FINAL.png
          retention-days: 1
