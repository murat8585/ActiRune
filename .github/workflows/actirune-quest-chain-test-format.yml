name: ActiRune Quest Chain Test Format

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-quest-chain-test-format.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Quest Chain regression
        run: dart format test/quest_chain_screen_test.dart

      - name: Capture formatted Quest Chain regression
        uses: actions/upload-artifact@v4
        with:
          name: actirune-formatted-quest-chain-test
          path: test/quest_chain_screen_test.dart
          retention-days: 1
