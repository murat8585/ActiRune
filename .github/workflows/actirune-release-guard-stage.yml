name: ActiRune Release Guard Stage

on:
  push:
    branches:
      - integration/release-guard-stage-20260923
    paths:
      - '.github/workflows/actirune-release-guard-stage.yml'

permissions:
  contents: write

jobs:
  validate-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release guard stage
        uses: actions/checkout@v4
        with:
          ref: integration/release-guard-stage-20260923

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply canonical Dart format
        run: >-
          dart format
          lib/core/release/production_release_guard.dart
          test/production_release_guard_test.dart
          tool/check_production_release_readiness.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused release guard tests
        run: flutter test --no-pub test/production_release_guard_test.dart

      - name: Full Flutter tests
        run: flutter test --no-pub

      - name: Diff hygiene
        run: git diff --check

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/core/release/production_release_guard.dart test/production_release_guard_test.dart tool/check_production_release_readiness.dart; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/release/production_release_guard.dart test/production_release_guard_test.dart tool/check_production_release_readiness.dart
          git commit -m 'Apply canonical production release guard formatting'
          git push origin HEAD:integration/release-guard-stage-20260923
