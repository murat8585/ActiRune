name: ActiRune Route Closure Apply

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-route-closure-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply route closure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shell_path = Path('lib/app/main_shell.dart')
          shell = shell_path.read_text(encoding='utf-8')

          old_home = (
              "        onSettings: () => _openSettingsHub(context),\n"
              "        onYesterdaySummary: () => _openDailySummary(context),\n"
          )
          new_home = (
              "        onSettings: () => _openSettingsHub(context),\n"
              "        onWorldMap: () => _openWorldProgression(context),\n"
              "        onYesterdaySummary: () => _openDailySummary(context),\n"
          )
          if shell.count(old_home) != 1:
              raise SystemExit('Expected exactly one Home route anchor')
          shell = shell.replace(old_home, new_home)

          old_profile = (
              "        onBadges: () => _openAchievements(context),\n"
              "        onWorldProgress: () => _openWorldProgression(context),\n"
          )
          new_profile = (
              "        onBadges: () => _openAchievements(context),\n"
              "        onMovementMastery: () => _openMovementMastery(context),\n"
              "        onWorldProgress: () => _openWorldProgression(context),\n"
          )
          if shell.count(old_profile) != 1:
              raise SystemExit('Expected exactly one Profile route anchor')
          shell = shell.replace(old_profile, new_profile)
          shell_path.write_text(shell, encoding='utf-8')

          test_path = Path('test/child_route_integration_test.dart')
          tests = test_path.read_text(encoding='utf-8')
          import_anchor = "import 'package:actirune/features/hero/movement_mastery_screen.dart';\n"
          if tests.count(import_anchor) != 1:
              raise SystemExit('Expected exactly one test import anchor')
          tests = tests.replace(
              import_anchor,
              "import 'package:actirune/features/adventure/world_progression_screen.dart';\n"
              + import_anchor,
          )

          insertion_anchor = "  testWidgets('Hero Equipment opens Inventory and back preserves the stack', (\n"
          addition = """  testWidgets('Home World Map opens World Progression child', (tester) async {
            await tester.pumpWidget(const MaterialApp(home: MainShell()));
            await tester.pumpAndSettle();

            await tester.tap(
              find.byKey(const ValueKey('artwork-hotspot-home.world-map')),
            );
            await tester.pumpAndSettle();

            expect(find.byType(WorldProgressionScreen), findsOneWidget);
          });

          testWidgets('Profile Movement Mastery opens exact child', (tester) async {
            await tester.pumpWidget(const MaterialApp(home: MainShell()));
            await tester.pumpAndSettle();
            await openProfile(tester);

            await tester.tap(
              find.byKey(
                const ValueKey('artwork-hotspot-profile.movement-mastery'),
              ),
            );
            await tester.pumpAndSettle();

            expect(find.byType(MovementMasteryScreen), findsOneWidget);
          });

"""
          if tests.count(insertion_anchor) != 1:
              raise SystemExit('Expected exactly one test insertion anchor')
          tests = tests.replace(insertion_anchor, addition + insertion_anchor)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Apply canonical Dart format
        run: dart format lib/app/main_shell.dart test/child_route_integration_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused route integration tests
        run: flutter test --no-pub test/child_route_integration_test.dart

      - name: Diff hygiene
        run: git diff --check

      - name: Commit route closure
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            lib/app/main_shell.dart
            test/child_route_integration_test.dart
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'No route closure change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Connect approved Phase-1 child routes'
          git push origin HEAD:integration/artwork-interactions-20260921
