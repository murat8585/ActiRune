name: ActiRune Route Closure Stage

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-route-closure-stage.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Connect approved routes
        run: |
          python3 -c "from pathlib import Path; p=Path('lib/app/main_shell.dart'); s=p.read_text(); old='        onSettings: () => _openSettingsHub(context),\n        onYesterdaySummary: () => _openDailySummary(context),\n'; new='        onSettings: () => _openSettingsHub(context),\n        onWorldMap: () => _openWorldProgression(context),\n        onYesterdaySummary: () => _openDailySummary(context),\n'; assert s.count(old) == 1; p.write_text(s.replace(old, new))"
          python3 -c "from pathlib import Path; p=Path('lib/app/main_shell.dart'); s=p.read_text(); old='        onBadges: () => _openAchievements(context),\n        onWorldProgress: () => _openWorldProgression(context),\n'; new='        onBadges: () => _openAchievements(context),\n        onMovementMastery: () => _openMovementMastery(context),\n        onWorldProgress: () => _openWorldProgression(context),\n'; assert s.count(old) == 1; p.write_text(s.replace(old, new))"

      - name: Add route regression coverage
        run: |
          cat > test/p1_route_closure_test.dart <<'DART'
          import 'package:actirune/app/main_shell.dart';
          import 'package:actirune/features/adventure/world_progression_screen.dart';
          import 'package:actirune/features/hero/movement_mastery_screen.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            testWidgets('Home World Map opens World Progression child', (tester) async {
              await tester.pumpWidget(const MaterialApp(home: MainShell()));
              await tester.pumpAndSettle();

              await tester.tap(
                find.byKey(const ValueKey('artwork-hotspot-home.world-map')),
              );
              await tester.pumpAndSettle();

              expect(find.byType(WorldProgressionScreen), findsOneWidget);
            });

            testWidgets('Profile Movement Mastery opens exact child', (tester) async {
              await tester.pumpWidget(const MaterialApp(home: MainShell()));
              await tester.pumpAndSettle();

              await tester.tap(
                find.byKey(const ValueKey('artwork-hotspot-home.nav-profile')),
              );
              await tester.pumpAndSettle();
              await tester.tap(
                find.byKey(
                  const ValueKey('artwork-hotspot-profile.movement-mastery'),
                ),
              );
              await tester.pumpAndSettle();

              expect(find.byType(MovementMasteryScreen), findsOneWidget);
            });
          }
          DART

      - name: Apply canonical Dart format
        run: dart format lib/app/main_shell.dart test/p1_route_closure_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Focused route tests
        run: flutter test --no-pub test/p1_route_closure_test.dart

      - name: Diff hygiene
        run: git diff --check

      - name: Commit approved route closure
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            lib/app/main_shell.dart
            test/p1_route_closure_test.dart
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Connect approved Phase-1 child routes'
          git push origin HEAD:integration/artwork-interactions-20260921
