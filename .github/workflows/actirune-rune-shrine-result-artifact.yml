name: ActiRune Rune Shrine Result Artwork Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-rune-shrine-result-artifact.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Guard exact Rune Shrine Result artwork
        shell: bash
        run: |
          set -euo pipefail
          test -f visual_authority/20260921/final_remaining_13/07_RUNE_SHRINE_RESULT_FINAL.png

      - name: Upload exact Rune Shrine Result artwork
        uses: actions/upload-artifact@v4
        with:
          name: actirune-rune-shrine-result-reference
          path: visual_authority/20260921/final_remaining_13/07_RUNE_SHRINE_RESULT_FINAL.png
          retention-days: 1
