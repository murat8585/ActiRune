name: ActiRune Rune Shrine Test Format Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-rune-shrine-test-format.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Rune Shrine result test
        run: dart format test/rune_shrine_result_test.dart

      - name: Upload formatted test
        uses: actions/upload-artifact@v4
        with:
          name: actirune-rune-shrine-result-formatted-test
          path: test/rune_shrine_result_test.dart
          retention-days: 1
