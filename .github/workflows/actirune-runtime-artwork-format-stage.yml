name: ActiRune Runtime Artwork Guard Formatter

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-runtime-artwork-format-stage.yml'
      - 'test/runtime_artwork_authority_test.dart'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply canonical Dart format
        run: dart format test/runtime_artwork_authority_test.dart

      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- test/runtime_artwork_authority_test.dart; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/runtime_artwork_authority_test.dart
          git commit -m 'Apply canonical artwork authority test formatting'
          git push origin HEAD:integration/artwork-interactions-20260921
