name: ActiRune Shop Artwork Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-shop-artifact.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921
      - name: Guard exact Shop artwork
        run: test -f visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0221__P1_SHOP_REVISION_FINAL.png
      - name: Upload exact Shop artwork
        uses: actions/upload-artifact@v4
        with:
          name: actirune-shop-reference
          path: visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0221__P1_SHOP_REVISION_FINAL.png
          retention-days: 1
