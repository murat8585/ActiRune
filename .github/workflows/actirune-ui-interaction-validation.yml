name: ActiRune UI Interaction Validation

on:
  push:
    branches:
      - fix/full-ui-interaction-wiring-20260925
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/interaction_audit.py'
      - 'validation/interactions/**'
      - 'pubspec.yaml'
      - '.github/workflows/actirune-ui-interaction-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actirune-ui-interaction-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Python production interaction audit
        run: python3 tool/interaction_audit.py

      - name: Enforce Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Home subtree focused tests
        run: >-
          flutter test --no-pub
          test/home_interaction_test.dart
          test/home_settings_route_test.dart
          test/home_subtree_production_test.dart
          test/home_permissions_production_test.dart
          test/home_subtree_navigation_test.dart
          test/home_subtree_auxiliary_navigation_test.dart
          test/daily_quests_route_integration_test.dart
          test/daily_quests_screen_test.dart
          test/weekly_quests_screen_test.dart
          test/events_route_integration_test.dart
          test/event_detail_popup_test.dart
          test/world_progression_route_integration_test.dart
          test/world_progression_screen_test.dart
          test/daily_summary_popup_test.dart
          test/rune_shrine_ready_screen_test.dart
          test/quest_engine_test.dart
          test/progression_policy_test.dart

      - name: Production interaction wiring tests
        run: flutter test --no-pub test/production_interaction_wiring_test.dart

      - name: Full Flutter tests
        run: flutter test --no-pub

      - name: Diff hygiene
        run: git diff --check
