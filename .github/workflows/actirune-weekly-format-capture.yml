name: ActiRune Weekly Test Format Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-weekly-format-capture.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format Weekly Quests test
        run: dart format test/weekly_quests_screen_test.dart

      - name: Upload formatted Weekly Quests test
        uses: actions/upload-artifact@v4
        with:
          name: actirune-weekly-formatted-test
          path: test/weekly_quests_screen_test.dart
          retention-days: 1
