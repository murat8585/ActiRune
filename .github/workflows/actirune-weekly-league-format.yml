name: ActiRune Weekly League Formatter Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-weekly-league-format.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Weekly League test in package context
        run: dart format test/weekly_league_result_popup_test.dart

      - name: Upload formatted Weekly League test
        uses: actions/upload-artifact@v4
        with:
          name: actirune-formatted-weekly-league-test
          path: test/weekly_league_result_popup_test.dart
          retention-days: 1
