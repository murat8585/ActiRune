name: ActiRune Weekly Quests Artwork Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-weekly-quests-artifact.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Guard exact Weekly Quests artwork
        shell: bash
        run: |
          set -euo pipefail
          test -f visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0228__P1_WEEKLY_QUESTS_FINAL.png

      - name: Upload exact Weekly Quests artwork
        uses: actions/upload-artifact@v4
        with:
          name: actirune-weekly-quests-reference
          path: visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0228__P1_WEEKLY_QUESTS_FINAL.png
          retention-days: 1
