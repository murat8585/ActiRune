name: ActiRune World Progression Artwork Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-world-progression-artifact.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921

      - name: Guard exact World Progression artwork
        shell: bash
        run: |
          set -euo pipefail
          test -f visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0218__P1_WORLD_PROGRESSION_FINAL.png

      - name: Upload exact World Progression artwork
        uses: actions/upload-artifact@v4
        with:
          name: actirune-world-progression-reference
          path: visual_authority/20260921/current/01_CANONICAL_FINAL/VIS_0218__P1_WORLD_PROGRESSION_FINAL.png
          retention-days: 1
