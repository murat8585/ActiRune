name: ActiRune World Progression Format Capture

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-world-progression-format.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format World Progression integration files
        run: >-
          dart format
          lib/app/main_shell.dart
          test/world_progression_screen_test.dart
          test/world_progression_route_integration_test.dart
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: actirune-world-progression-formatted
          path: |
            lib/app/main_shell.dart
            test/world_progression_screen_test.dart
            test/world_progression_route_integration_test.dart
          retention-days: 1
