name: ActiRune World Progression Format Apply

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-world-progression-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format World Progression integration files
        run: >-
          dart format
          lib/app/main_shell.dart
          test/world_progression_screen_test.dart
          test/world_progression_route_integration_test.dart
      - name: Commit canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/app/main_shell.dart test/world_progression_screen_test.dart test/world_progression_route_integration_test.dart; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/main_shell.dart test/world_progression_screen_test.dart test/world_progression_route_integration_test.dart
          git commit -m 'Apply World Progression Dart formatting'
          git push origin HEAD:integration/artwork-interactions-20260921
