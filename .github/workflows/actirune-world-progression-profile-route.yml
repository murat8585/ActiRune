name: ActiRune World Progression Profile Route Apply

on:
  push:
    branches:
      - integration/artwork-interactions-20260921
    paths:
      - '.github/workflows/actirune-world-progression-profile-route.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/artwork-interactions-20260921
      - name: Connect Profile World Progression route
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/app/main_shell.dart')
          text = path.read_text()
          needle = "        onProfileDetails: () => _openPlayerLevel(context),\n        onHistory: () => _openProfileHistory(context),"
          replacement = "        onProfileDetails: () => _openPlayerLevel(context),\n        onWorldProgress: () => _openWorldProgression(context),\n        onHistory: () => _openProfileHistory(context),"
          if text.count(needle) != 1:
              raise SystemExit('Profile route anchor not found exactly once')
          path.write_text(text.replace(needle, replacement))
          PY
      - name: Commit Profile World Progression route
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/app/main_shell.dart
          git commit -m 'Connect Profile World Progression route'
          git push origin HEAD:integration/artwork-interactions-20260921
