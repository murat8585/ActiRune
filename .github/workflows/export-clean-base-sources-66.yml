name: Export Clean Base Source PNGs 66

on:
  push:
    branches:
      - codex/export-clean-base-sources-66-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source-export branch
        uses: actions/checkout@v4

      - name: Collect exact original source PNGs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf export
          mkdir -p export
          cat > expected_sources.txt <<'EOF'
VIS_0354__CORE_HOME_ANCHOR.png
