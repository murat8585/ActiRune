          expected_count=$(grep -cve '^$' expected_sources.txt)
          test "$expected_count" -eq 66
          printf 'filename\trepository_path\tsha256\n' > export/SOURCE_MANIFEST.tsv
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            mapfile -t matches < <(git ls-files | awk -v n="$name" 'BEGIN{FS="/"} $NF==n {print}')
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "ERROR: $name expected exactly 1 tracked match, found ${#matches[@]}" >&2
              printf '%s\n' "${matches[@]:-}" >&2
              exit 1
            fi
            src="${matches[0]}"
            cp -- "$src" "export/$name"
            sum=$(sha256sum "export/$name" | awk '{print $1}')
            printf '%s\t%s\t%s\n' "$name" "$src" "$sum" >> export/SOURCE_MANIFEST.tsv
          done < expected_sources.txt
          actual_count=$(find export -maxdepth 1 -type f -name '*.png' | wc -l)
          test "$actual_count" -eq 66
          sha256sum export/*.png > export/SHA256SUMS.txt
          printf 'EXPECTED_SOURCE_COUNT=66\nACTUAL_SOURCE_COUNT=%s\nSOURCE_REF=%s\n' "$actual_count" "${GITHUB_SHA}" > export/VERIFY.txt

      - name: Upload verified source bundle
        uses: actions/upload-artifact@v4
        with:
          name: ACTIRUNE_CLEAN_BASE_ORIGINAL_SOURCES_66
          path: export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
