name: Finalize Home Events Preview Behavior

on:
  push:
    branches:
      - fix/real-ui-navigation-20260925
    paths:
      - .github/workflows/home-events-finalize-patch.yml

permissions:
  contents: write

jobs:
  finalize-events:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current Home branch
        uses: actions/checkout@v4
        with:
          ref: fix/real-ui-navigation-20260925
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Patch Events owner and production expectations
        shell: python
        run: |
          from pathlib import Path

          shell = Path('lib/app/main_shell.dart')
          text = shell.read_text(encoding='utf-8')
          old_info = "          onInfo: () => _showUnavailable(routeContext, 'Etkinlik Bilgisi'),\n"
          old_filter = "          onFilter: (_) => _showUnavailable(routeContext, 'Etkinlik Filtresi'),\n"
          if old_info not in text or old_filter not in text:
              raise SystemExit('Events MainShell ownership markers not found')
          text = text.replace(old_info, '', 1).replace(old_filter, '', 1)
          shell.write_text(text, encoding='utf-8')

          audit = Path('tool/interaction_audit.py')
          text = audit.read_text(encoding='utf-8')
          old_allow = '''ALLOW_MISSING = {
              ("AchievementsScreen", "onFilterChanged"),
          }'''
          new_allow = '''ALLOW_MISSING = {
              ("AchievementsScreen", "onFilterChanged"),
              ("EventsScreen", "onFilter"),
              ("EventsScreen", "onInfo"),
          }'''
          if old_allow not in text:
              raise SystemExit('ALLOW_MISSING marker not found')
          audit.write_text(text.replace(old_allow, new_allow, 1), encoding='utf-8')

          test = Path('test/home_subtree_production_test.dart')
          text = test.read_text(encoding='utf-8')
          import_marker = "import 'package:actirune/features/home/events_screen.dart';\n"
          if "home_preview_dialog.dart" not in text:
              if import_marker not in text:
                  raise SystemExit('Home preview dialog import marker not found')
              text = text.replace(
                  import_marker,
                  import_marker + "import 'package:actirune/features/home/home_preview_dialog.dart';\n",
                  1,
              )

          old_expectations = '''      await tapHotspot(tester, 'events.info');
              await expectUnavailable(tester, 'Etkinlik Bilgisi');

              for (final filter in <String>['active', 'upcoming', 'completed']) {
                await tapHotspot(tester, 'events.filter-$filter');
                await expectUnavailable(tester, 'Etkinlik Filtresi');
              }
          '''
          new_expectations = '''      await tapHotspot(tester, 'events.info');
              expect(find.byType(HomePreviewDialog), findsOneWidget);
              expect(find.byType(FeatureUnavailableDialog), findsNothing);
              await tester.tap(find.byKey(const ValueKey('home-preview-dialog-close')));
              await tester.pumpAndSettle();

              for (final filter in <String>['active', 'upcoming', 'completed']) {
                await tapHotspot(tester, 'events.filter-$filter');
                expect(
                  find.byKey(
                    ValueKey<String>('artwork-overlay-events.filter-selection-$filter'),
                  ),
                  findsOneWidget,
                );
                expect(find.byType(FeatureUnavailableDialog), findsNothing);
              }
          '''
          if old_expectations not in text:
              raise SystemExit('Old Events production expectations not found')
          test.write_text(text.replace(old_expectations, new_expectations, 1), encoding='utf-8')

      - name: Format bounded files
        run: >-
          dart format
          lib/app/main_shell.dart
          lib/features/home/events_screen.dart
          lib/features/home/home_preview_dialog.dart
          test/events_route_integration_test.dart
          test/home_subtree_production_test.dart

      - name: Assert bounded patch
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only -- lib test tool | sort | tr '\n' ' ')"
          echo "Changed lib/test/tool files: $changed"
          for path in $(git diff --name-only -- lib test tool); do
            case "$path" in
              lib/app/main_shell.dart|lib/features/home/events_screen.dart|lib/features/home/home_preview_dialog.dart|test/events_route_integration_test.dart|test/home_subtree_production_test.dart|tool/interaction_audit.py) ;;
              *) echo "Unexpected Events finalize file: $path"; exit 1 ;;
            esac
          done

      - name: Interaction audit
        run: python3 tool/interaction_audit.py

      - name: Analyze
        run: flutter analyze

      - name: Events and Home tests
        run: >-
          flutter test --no-pub
          test/events_route_integration_test.dart
          test/event_detail_popup_test.dart
          test/home_subtree_production_test.dart

      - name: Commit validated Events behavior
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app/main_shell.dart lib/features/home/events_screen.dart lib/features/home/home_preview_dialog.dart test/events_route_integration_test.dart test/home_subtree_production_test.dart tool/interaction_audit.py
          git commit -m "Finalize Home Events preview interactions"
          git push origin HEAD:fix/real-ui-navigation-20260925
