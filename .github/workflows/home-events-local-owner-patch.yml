name: Apply And Validate Home Events Local Owner

on:
  push:
    branches:
      - fix/real-ui-navigation-20260925
    paths:
      - .github/workflows/home-events-local-owner-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate-events:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current Home branch
        uses: actions/checkout@v4
        with:
          ref: fix/real-ui-navigation-20260925
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Patch Events ownership
        shell: python
        run: |
          from pathlib import Path

          shell = Path('lib/app/main_shell.dart')
          text = shell.read_text(encoding='utf-8')
          old_info = "          onInfo: () => _showUnavailable(routeContext, 'Etkinlik Bilgisi'),\n"
          old_filter = "          onFilter: (_) => _showUnavailable(routeContext, 'Etkinlik Filtresi'),\n"
          if old_info not in text:
              raise SystemExit('Events onInfo MainShell marker not found')
          if old_filter not in text:
              raise SystemExit('Events onFilter MainShell marker not found')
          text = text.replace(old_info, '', 1).replace(old_filter, '', 1)
          shell.write_text(text, encoding='utf-8')

          audit = Path('tool/interaction_audit.py')
          text = audit.read_text(encoding='utf-8')
          old_allow = '''ALLOW_MISSING = {
              ("AchievementsScreen", "onFilterChanged"),
          }'''
          new_allow = '''ALLOW_MISSING = {
              ("AchievementsScreen", "onFilterChanged"),
              ("EventsScreen", "onFilter"),
              ("EventsScreen", "onInfo"),
          }'''
          if old_allow not in text:
              raise SystemExit('ALLOW_MISSING marker not found')
          audit.write_text(text.replace(old_allow, new_allow, 1), encoding='utf-8')

      - name: Format bounded files
        run: >-
          dart format
          lib/app/main_shell.dart
          lib/features/home/events_screen.dart
          lib/features/home/home_preview_dialog.dart
          test/events_route_integration_test.dart

      - name: Assert bounded patch
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only -- lib test tool | sort | tr '\n' ' ')"
          echo "Changed lib/test/tool files: $changed"
          for path in $(git diff --name-only -- lib test tool); do
            case "$path" in
              lib/app/main_shell.dart|lib/features/home/events_screen.dart|lib/features/home/home_preview_dialog.dart|test/events_route_integration_test.dart|tool/interaction_audit.py) ;;
              *) echo "Unexpected Home Events patch file: $path"; exit 1 ;;
            esac
          done

      - name: Interaction audit
        run: python3 tool/interaction_audit.py

      - name: Analyze
        run: flutter analyze

      - name: Events focused tests
        run: >-
          flutter test --no-pub
          test/events_route_integration_test.dart
          test/event_detail_popup_test.dart
          test/home_subtree_production_test.dart

      - name: Commit validated Events ownership
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app/main_shell.dart lib/features/home/events_screen.dart lib/features/home/home_preview_dialog.dart test/events_route_integration_test.dart tool/interaction_audit.py
          git commit -m "Open Home Events info and filter previews"
          git push origin HEAD:fix/real-ui-navigation-20260925
