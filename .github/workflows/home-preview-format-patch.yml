name: Format Home Preview Patch

on:
  push:
    branches:
      - fix/real-ui-navigation-20260925
    paths:
      - .github/workflows/home-preview-format-patch.yml

permissions:
  contents: write

jobs:
  format-home-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-ui-navigation-20260925
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format bounded Home files
        run: >-
          dart format
          lib/app/main_shell.dart
          lib/features/home/daily_streak_preview_screen.dart
          lib/features/home/rune_inbox_preview_screen.dart
          lib/features/home/quest_center_preview_screen.dart
          test/home_subtree_production_test.dart
          test/daily_quests_route_integration_test.dart

      - name: Assert format scope
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          echo "Changed: $changed"
          for path in $(git diff --name-only); do
            case "$path" in
              lib/app/main_shell.dart|lib/features/home/daily_streak_preview_screen.dart|lib/features/home/rune_inbox_preview_screen.dart|lib/features/home/quest_center_preview_screen.dart|test/home_subtree_production_test.dart|test/daily_quests_route_integration_test.dart) ;;
              *) echo "Unexpected formatted file: $path"; exit 1 ;;
            esac
          done

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app/main_shell.dart lib/features/home/daily_streak_preview_screen.dart lib/features/home/rune_inbox_preview_screen.dart lib/features/home/quest_center_preview_screen.dart test/home_subtree_production_test.dart test/daily_quests_route_integration_test.dart
          git commit -m "Format Home preview routes"
          git push origin HEAD:fix/real-ui-navigation-20260925
