name: Apply Home Preview Routes

on:
  push:
    branches:
      - fix/real-ui-navigation-20260925
    paths:
      - .github/workflows/home-preview-patch.yml

permissions:
  contents: write

jobs:
  patch-home-preview-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-ui-navigation-20260925
          fetch-depth: 0

      - name: Patch Home preview routes and tests
        shell: python
        run: |
          from pathlib import Path

          shell = Path('lib/app/main_shell.dart')
          text = shell.read_text(encoding='utf-8')

          old_imports = """import '../features/home/daily_summary_popup.dart';
          import '../features/home/event_detail_popup.dart';
          import '../features/home/events_screen.dart';
          import '../features/home/home_screen.dart';
          import '../features/home/rune_shrine_ready_screen.dart';
          """
          new_imports = """import '../features/home/daily_streak_preview_screen.dart';
          import '../features/home/daily_summary_popup.dart';
          import '../features/home/event_detail_popup.dart';
          import '../features/home/events_screen.dart';
          import '../features/home/home_screen.dart';
          import '../features/home/quest_center_preview_screen.dart';
          import '../features/home/rune_inbox_preview_screen.dart';
          import '../features/home/rune_shrine_ready_screen.dart';
          """
          if old_imports not in text:
              raise SystemExit('main_shell import marker not found')
          text = text.replace(old_imports, new_imports, 1)

          marker = "  Future<void> _openDailySummary(BuildContext context) async {"
          helpers = """  Future<void> _openDailyStreakPreview(BuildContext context) async {
            await Navigator.of(context).push<void>(
              MaterialPageRoute<void>(
                builder: (routeContext) => DailyStreakPreviewScreen(
                  onBack: () => Navigator.of(routeContext).pop(),
                ),
              ),
            );
          }

          Future<void> _openRuneInboxPreview(BuildContext context) async {
            await Navigator.of(context).push<void>(
              MaterialPageRoute<void>(
                builder: (routeContext) => RuneInboxPreviewScreen(
                  onBack: () => Navigator.of(routeContext).pop(),
                ),
              ),
            );
          }

          Future<void> _openQuestCenterPreview(BuildContext context) async {
            await Navigator.of(context).push<void>(
              MaterialPageRoute<void>(
                builder: (routeContext) => QuestCenterPreviewScreen(
                  onBack: () => Navigator.of(routeContext).pop(),
                ),
              ),
            );
          }

          """
          if marker not in text:
              raise SystemExit('main_shell helper marker not found')
          text = text.replace(marker, helpers + marker, 1)

          old_home = """        onDailyStreak: () => _showUnavailable(
                    context,
                    'Günlük Seri',
                    message:
                        '7 günlük esnek seri sistemi canlı aktivite verisine bağlandığında bu alan açılacak.',
                  ),
                  onMessages: () => _showUnavailable(context, 'Rune Gelen Kutusu'),
                  onQuests: () => _showUnavailable(
                    context,
                    'Görevler',
                    message:
                        'Görevler ana merkezi ve canlı ilerleme durumu tamamlandığında bu alan açılacak.',
                  ),
          """
          new_home = """        onDailyStreak: () => _openDailyStreakPreview(context),
                  onMessages: () => _openRuneInboxPreview(context),
                  onQuests: () => _openQuestCenterPreview(context),
          """
          if old_home not in text:
              raise SystemExit('Home callback marker not found')
          text = text.replace(old_home, new_home, 1)
          shell.write_text(text, encoding='utf-8')

          test = Path('test/home_subtree_production_test.dart')
          text = test.read_text(encoding='utf-8')
          import_marker = "import 'package:actirune/features/home/daily_summary_popup.dart';\n"
          preview_imports = """import 'package:actirune/features/home/daily_streak_preview_screen.dart';
          import 'package:actirune/features/home/daily_summary_popup.dart';
          import 'package:actirune/features/home/quest_center_preview_screen.dart';
          import 'package:actirune/features/home/rune_inbox_preview_screen.dart';
          """
          if import_marker not in text:
              raise SystemExit('Home test import marker not found')
          text = text.replace(import_marker, preview_imports, 1)

          old_actions = """    await pumpHome(tester);
              await tapHotspot(tester, 'home.daily-streak');
              await expectUnavailable(tester, 'Günlük Seri');

              await pumpHome(tester);
              await tapHotspot(tester, 'home.messages');
              await expectUnavailable(tester, 'Rune Gelen Kutusu');

              await pumpHome(tester);
              await tapHotspot(tester, 'home.quests');
              await expectUnavailable(tester, 'Görevler');
          """
          new_actions = """    await pumpHome(tester);
              await tapHotspot(tester, 'home.daily-streak');
              expect(find.byType(DailyStreakPreviewScreen), findsOneWidget);
              await tester.tap(find.byKey(const ValueKey('daily-streak-preview-back')));
              await tester.pumpAndSettle();

              await pumpHome(tester);
              await tapHotspot(tester, 'home.messages');
              expect(find.byType(RuneInboxPreviewScreen), findsOneWidget);
              await tester.tap(find.byKey(const ValueKey('rune-inbox-preview-back')));
              await tester.pumpAndSettle();

              await pumpHome(tester);
              await tapHotspot(tester, 'home.quests');
              expect(find.byType(QuestCenterPreviewScreen), findsOneWidget);
              await tester.tap(find.byKey(const ValueKey('quest-center-preview-back')));
              await tester.pumpAndSettle();
          """
          if old_actions not in text:
              raise SystemExit('Home test action marker not found')
          text = text.replace(old_actions, new_actions, 1)
          test.write_text(text, encoding='utf-8')

          daily = Path('test/daily_quests_route_integration_test.dart')
          text = daily.read_text(encoding='utf-8')
          text = text.replace(
              "import 'package:actirune/core/widgets/feature_unavailable_dialog.dart';\n",
              "import 'package:actirune/features/home/daily_streak_preview_screen.dart';\n",
              1,
          )
          old_daily = """      expect(find.byType(FeatureUnavailableDialog), findsOneWidget);
                expect(find.text('Günlük Seri'), findsOneWidget);
                expect(find.byType(DailyQuestsScreen), findsNothing);
                expect(
                  find.text(
                    '7 günlük esnek seri sistemi canlı aktivite verisine bağlandığında bu alan açılacak.',
                  ),
                  findsOneWidget,
                );

                await tester.tap(find.byKey(const ValueKey('feature-unavailable-close')));
                await tester.pumpAndSettle();
                expect(find.byType(HomeScreen), findsOneWidget);
          """
          new_daily = """      expect(find.byType(DailyStreakPreviewScreen), findsOneWidget);
                expect(find.byType(DailyQuestsScreen), findsNothing);

                await tester.tap(
                  find.byKey(const ValueKey('daily-streak-preview-back')),
                );
                await tester.pumpAndSettle();
                expect(find.byType(HomeScreen), findsOneWidget);
          """
          if old_daily not in text:
              raise SystemExit('Daily streak test marker not found')
          text = text.replace(old_daily, new_daily, 1)
          daily.write_text(text, encoding='utf-8')

      - name: Assert patch scope
        shell: bash
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "lib/app/main_shell.dart test/daily_quests_route_integration_test.dart test/home_subtree_production_test.dart "
          grep -q "_openDailyStreakPreview(context)" lib/app/main_shell.dart
          grep -q "_openRuneInboxPreview(context)" lib/app/main_shell.dart
          grep -q "_openQuestCenterPreview(context)" lib/app/main_shell.dart

      - name: Commit bounded Home preview wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app/main_shell.dart test/home_subtree_production_test.dart test/daily_quests_route_integration_test.dart
          git commit -m "Open Home preview routes for device testing"
          git push origin HEAD:fix/real-ui-navigation-20260925
