name: ActiRune Home Preview Validation

on:
  push:
    branches:
      - fix/real-ui-navigation-20260925
    paths:
      - 'lib/app/main_shell.dart'
      - 'lib/features/home/**'
      - 'test/home_*.dart'
      - 'test/daily_quests_route_integration_test.dart'
      - 'tool/interaction_audit.py'
      - 'validation/interactions/**'
      - 'pubspec.yaml'
      - '.github/workflows/home-preview-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actirune-home-preview-validation
  cancel-in-progress: true

jobs:
  validate-home:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Interaction audit
        run: python3 tool/interaction_audit.py

      - name: Enforce Dart formatting
        shell: bash
        run: |
          dart format lib test
          if ! git diff --quiet -- lib test; then
            echo 'Dart formatting differs from repository content:'
            git --no-pager diff -- lib test
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Home focused tests
        run: >-
          flutter test --no-pub
          test/home_interaction_test.dart
          test/home_hitbox_regression_test.dart
          test/home_settings_route_test.dart
          test/home_subtree_production_test.dart
          test/home_permissions_production_test.dart
          test/home_subtree_navigation_test.dart
          test/home_subtree_auxiliary_navigation_test.dart
          test/daily_quests_route_integration_test.dart
          test/events_route_integration_test.dart
          test/event_detail_popup_test.dart
          test/world_progression_route_integration_test.dart
          test/world_progression_screen_test.dart
          test/daily_summary_popup_test.dart
          test/rune_shrine_ready_screen_test.dart

      - name: Diff hygiene
        run: git diff --check
