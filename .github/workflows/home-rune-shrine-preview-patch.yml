name: Open Home Rune Shrine Preview

on:
  push:
    branches:
      - fix/real-ui-navigation-20260925
    paths:
      - .github/workflows/home-rune-shrine-preview-patch.yml

permissions:
  contents: write

jobs:
  patch-rune-shrine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current Home branch
        uses: actions/checkout@v4
        with:
          ref: fix/real-ui-navigation-20260925
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Patch Rune Shrine preview behavior
        shell: python
        run: |
          from pathlib import Path

          shell = Path('lib/app/main_shell.dart')
          text = shell.read_text(encoding='utf-8')
          old = '''          onOpenGift: () => _showUnavailable(
            routeContext,
            'Rün Hediyesi',
            message:
                'Ödüllü reklam ve gerçek ödül sahibi bağlanmadan hediye verilemez.',
          ),'''
          new = '''          onOpenGift: () => _showHomePreview(
            routeContext,
            'Rün Hediyesi',
            'Rün hediyesi önizlemesi açık. Ödüllü reklam ve gerçek ödül sahibi bağlanmadığı için bu test sürümünde rune, envanter veya para birimi değiştirilmez.',
          ),'''
          if old not in text:
              raise SystemExit('Rune Shrine MainShell marker not found')
          shell.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('test/home_subtree_production_test.dart')
          text = test.read_text(encoding='utf-8')
          old = '''    await tapHotspot(tester, 'rune-shrine-ready.open-gift');
    await expectUnavailable(tester, 'Rün Hediyesi');
    expect(find.byType(RuneShrineReadyScreen), findsOneWidget);'''
          new = '''    await tapHotspot(tester, 'rune-shrine-ready.open-gift');
    expect(find.byType(HomePreviewDialog), findsOneWidget);
    expect(find.byType(FeatureUnavailableDialog), findsNothing);
    expect(find.byType(RuneShrineReadyScreen), findsOneWidget);
    await tester.tap(find.byKey(const ValueKey('home-preview-dialog-close')));
    await tester.pumpAndSettle();
    expect(find.byType(RuneShrineReadyScreen), findsOneWidget);'''
          if old not in text:
              raise SystemExit('Rune Shrine Home test marker not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Format bounded files
        run: >-
          dart format
          lib/app/main_shell.dart
          test/home_subtree_production_test.dart

      - name: Assert bounded patch
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only -- lib test tool | sort | tr '\n' ' ')"
          echo "Changed lib/test/tool files: $changed"
          for path in $(git diff --name-only -- lib test tool); do
            case "$path" in
              lib/app/main_shell.dart|test/home_subtree_production_test.dart) ;;
              *) echo "Unexpected Rune Shrine patch file: $path"; exit 1 ;;
            esac
          done

      - name: Interaction audit
        run: python3 tool/interaction_audit.py

      - name: Analyze
        run: flutter analyze

      - name: Rune Shrine and Home tests
        run: >-
          flutter test --no-pub
          test/rune_shrine_ready_screen_test.dart
          test/home_subtree_production_test.dart

      - name: Commit validated Rune Shrine preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app/main_shell.dart test/home_subtree_production_test.dart
          git commit -m "Open Home Rune Shrine reward preview"
          git push origin HEAD:fix/real-ui-navigation-20260925
