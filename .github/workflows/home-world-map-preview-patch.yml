name: Open Home World Map Preview Actions

on:
  push:
    branches:
      - fix/real-ui-navigation-20260925
    paths:
      - .github/workflows/home-world-map-preview-patch.yml

permissions:
  contents: write

jobs:
  patch-world-map:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current Home branch
        uses: actions/checkout@v4
        with:
          ref: fix/real-ui-navigation-20260925
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Patch Home World Map preview ownership
        shell: python
        run: |
          from pathlib import Path

          shell = Path('lib/app/main_shell.dart')
          text = shell.read_text(encoding='utf-8')

          import_marker = "import '../features/home/home_screen.dart';\n"
          preview_import = "import '../features/home/home_preview_dialog.dart';\n"
          if preview_import not in text:
              if import_marker not in text:
                  raise SystemExit('Home preview import marker not found')
              text = text.replace(import_marker, import_marker + preview_import, 1)

          helper_marker = "  void _select(_ShellDestination next) {\n"
          helper = '''  void _showHomePreview(
            BuildContext context,
            String title,
            String message,
          ) {
            unawaited(
              HomePreviewDialog.show(
                context,
                title: title,
                message: message,
              ),
            );
          }

          '''
          if '_showHomePreview(' not in text:
              if helper_marker not in text:
                  raise SystemExit('Home preview helper marker not found')
              text = text.replace(helper_marker, helper + helper_marker, 1)

          old_block = '''          onRegionSelect: () => _showUnavailable(routeContext, 'Bölge Seçimi'),
                    onAncientTree: () => _showUnavailable(routeContext, 'Kadim Ağaç'),
                    onLostRuneCave: () =>
                        _showUnavailable(routeContext, 'Kayıp Rün Mağarası'),
                    onWaterfallTemple: () =>
                        _showUnavailable(routeContext, 'Şelale Tapınağı'),
                    onWindCliffs: () =>
                        _showUnavailable(routeContext, 'Rüzgar Kayalıkları'),
                    onShowNextTarget: () =>
                        _showUnavailable(routeContext, 'Sonraki Hedef'),
                    onBossPreview: () => _showUnavailable(routeContext, 'Boss Ön İzleme'),
                    onRewardPreview: () =>
                        _showUnavailable(routeContext, 'Ödül Ön İzleme'),
          '''
          new_block = '''          onRegionSelect: () => _showHomePreview(
                    routeContext,
                    'Bölge Seçimi',
                    'Bölge seçimi önizlemesi açık. Canlı bölge sahipliği bağlanmadığı için bu test sürümünde harita kalıcı olarak değiştirilmiyor.',
                  ),
                  onAncientTree: () => _showHomePreview(
                    routeContext,
                    'Kadim Ağaç',
                    'Kadim Ağaç keşif noktası önizlemesi. Canlı ilerleme bağlandığında görev ve karşılaşma ayrıntıları burada açılacak.',
                  ),
                  onLostRuneCave: () => _showHomePreview(
                    routeContext,
                    'Kayıp Rün Mağarası',
                    'Kayıp Rün Mağarası keşif noktası önizlemesi. Canlı ilerleme ve ödül sahipliği bu önizlemede değiştirilmez.',
                  ),
                  onWaterfallTemple: () => _showHomePreview(
                    routeContext,
                    'Şelale Tapınağı',
                    'Şelale Tapınağı keşif noktası önizlemesi. Bu ekran salt okunurdur; görev veya ödül durumu değiştirilmez.',
                  ),
                  onWindCliffs: () => _showHomePreview(
                    routeContext,
                    'Rüzgar Kayalıkları',
                    'Rüzgar Kayalıkları keşif noktası önizlemesi. Canlı progression owner bağlanana kadar yalnız bilgi gösterilir.',
                  ),
                  onShowNextTarget: () => _showHomePreview(
                    routeContext,
                    'Sonraki Hedef',
                    'Sonraki hedef önizlemesi. Canlı progression owner bağlanmadığından haritada kalıcı seçim yapılmıyor.',
                  ),
                  onBossPreview: () => _showHomePreview(
                    routeContext,
                    'Boss Ön İzleme',
                    'Boss şu anda kilitli. Bu önizleme yalnız kilit durumunu gösterir; savaş başlatılmaz ve boss açılmaz.',
                  ),
                  onRewardPreview: () => _showHomePreview(
                    routeContext,
                    'Ödül Ön İzleme',
                    'Bölge ödülü önizlemesi. Gerçek ödül sahibi bağlanmadan hiçbir ödül verilmez veya envanter değiştirilmez.',
                  ),
          '''
          if old_block not in text:
              raise SystemExit('World Progression callback block not found')
          text = text.replace(old_block, new_block, 1)
          shell.write_text(text, encoding='utf-8')

          test = Path('test/home_subtree_production_test.dart')
          text = test.read_text(encoding='utf-8')
          start_marker = "      const unavailable = <String, String>{\n"
          end_marker = "\n      await tapHotspot(tester, 'world-progression.notifications');\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('World Progression test start marker not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('World Progression test end marker not found')

          replacement = '''      const previews = <String, String>{
                'world-progression.region-select': 'Bölge Seçimi',
                'world-progression.ancient-tree': 'Kadim Ağaç',
                'world-progression.lost-rune-cave': 'Kayıp Rün Mağarası',
                'world-progression.waterfall-temple': 'Şelale Tapınağı',
                'world-progression.wind-cliffs': 'Rüzgar Kayalıkları',
                'world-progression.show-next-target': 'Sonraki Hedef',
                'world-progression.boss-preview': 'Boss Ön İzleme',
                'world-progression.reward-preview': 'Ödül Ön İzleme',
              };
              for (final entry in previews.entries) {
                await tapHotspot(tester, entry.key);
                expect(find.byType(HomePreviewDialog), findsOneWidget);
                expect(find.text(entry.value), findsOneWidget);
                expect(find.byType(FeatureUnavailableDialog), findsNothing);
                expect(find.byType(WorldProgressionScreen), findsOneWidget);
                await tester.tap(find.byKey(const ValueKey('home-preview-dialog-close')));
                await tester.pumpAndSettle();
              }
          '''
          text = text[:start] + replacement + text[end:]
          test.write_text(text, encoding='utf-8')

      - name: Format bounded files
        run: >-
          dart format
          lib/app/main_shell.dart
          test/home_subtree_production_test.dart

      - name: Assert bounded World Map patch
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only -- lib test | sort | tr '\n' ' ')"
          echo "Changed lib/test files: $changed"
          test "$changed" = "lib/app/main_shell.dart test/home_subtree_production_test.dart "
          grep -q "Boss şu anda kilitli" lib/app/main_shell.dart
          grep -q "HomePreviewDialog" test/home_subtree_production_test.dart

      - name: Interaction audit
        run: python3 tool/interaction_audit.py

      - name: Analyze
        run: flutter analyze

      - name: Home World Map tests
        run: >-
          flutter test --no-pub
          test/world_progression_screen_test.dart
          test/home_subtree_production_test.dart

      - name: Commit validated World Map previews
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/app/main_shell.dart test/home_subtree_production_test.dart
          git commit -m "Open Home World Map read-only previews"
          git push origin HEAD:fix/real-ui-navigation-20260925
