name: Import ActiRune final PASS 60 assets

on:
  push:
    branches:
      - codex/final-pass-60-assets-20260927
    paths:
      - .github/workflows/import-final-pass-60.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/final-pass-60-assets-20260927
          fetch-depth: 0

      - name: Download verified PASS package
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/actirune_pass_60.zip 'https://at.adobe.com/QlJeThYJcHPmEzOI'
          echo 'F99B8E4A4D11C4B71199B7BA2D0444AB1FC768661EC15E5CED0B52CF495DC1DE  /tmp/actirune_pass_60.zip' | sha256sum -c -

      - name: Extract and validate exactly 60 PNG files
        run: |
          set -euo pipefail
          rm -rf /tmp/actirune_pass_60
          mkdir -p /tmp/actirune_pass_60
          unzip -q /tmp/actirune_pass_60.zip -d /tmp/actirune_pass_60
          count=$(find /tmp/actirune_pass_60 -maxdepth 1 -type f -name '*.png' | wc -l)
          test "$count" -eq 60
          test -f /tmp/actirune_pass_60/ACTIRUNE_FINAL_PASS_60_MANIFEST.json

      - name: Install final clean-base assets
        run: |
          set -euo pipefail
          rm -rf assets/ui/clean_base_final_60
          mkdir -p assets/ui/clean_base_final_60
          cp /tmp/actirune_pass_60/*.png assets/ui/clean_base_final_60/
          cp /tmp/actirune_pass_60/ACTIRUNE_FINAL_PASS_60_MANIFEST.json assets/ui/clean_base_final_60/
          test "$(find assets/ui/clean_base_final_60 -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 60

      - name: Commit assets only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ui/clean_base_final_60
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'Add final 60 PASS clean-base assets'
          git push origin HEAD:codex/final-pass-60-assets-20260927
