name: Bootstrap current ActiRune source

on:
  push:
    branches:
      - integration/artwork-interactions-upload2
    paths:
      - '.bootstrap/actirune_source_sync.tar.gz'
      - '.github/workflows/source-sync.yml'

permissions:
  contents: write

jobs:
  sync-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand current source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .bootstrap/actirune_source_sync.tar.gz
          rm -f .bootstrap/actirune_source_sync.tar.gz

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Battle interaction gate
        run: >-
          flutter test
          test/battle_session_engine_test.dart
          test/final_battle_artwork_test.dart
          test/artwork_interaction_test.dart

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/source-sync.yml
          rmdir .bootstrap 2>/dev/null || true
          git config user.name "ActiRune Integration"
          git config user.email "actirune-integration@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Sync current ActiRune implementation source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
